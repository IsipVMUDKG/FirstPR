<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Работа с подключёнными номерами</title>
</head>
<body>

    <h1>Редактировать подключение</h1>

</form>
<a href="{% url 'podchenie_list' %}">Отмена</a>
</body>
</html>
