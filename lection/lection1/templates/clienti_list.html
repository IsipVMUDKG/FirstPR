<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список клиентов</title>
</head>
<body>
    <h1>Список клиентов</h1>
<a href="{% url 'clienti_create' %}">Добавить нового клиента</a>
<ul>
    {% for client in object_list %}
        <li>
            <a href="{% url 'clienti_detail' client.pk %}">{{ client.Familia }} {{ client.Imya }}</a>
            | <a href="{% url 'clienti_update' client.pk %}">Редактировать</a>
            | <a href="{% url 'clienti_delete' client.pk %}">Удалить</a>
        </li>
    {% empty %}
        <li>Клиентов пока нет.</li>
    {% endfor %}
</ul>
</body>
</html>
